<body>
<title>跨層級系統問題診斷、決策與策略治理輔助系統</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="gateStyle">
:root{--bg:#F2F5F4;--surface:#FFFFFF;--ink:#16201E;--muted:#5B6A66;--line:#D2DBD8;--accent:#0D6B61;--accent-ink:#FFFFFF;--bad:#B3261E;--l1:#8CCFC3;--l2:#66BBB0;--l3:#43A49A;--l4:#2C8C84;--l5:#22736D;--l6:#1F5B64;--l7:#22475C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1513;--surface:#161E1C;--ink:#E2EBE8;--muted:#93A4A0;--line:#2B3835;--accent:#4CC0B0;--accent-ink:#04211D;--bad:#F08A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1513;--surface:#161E1C;--ink:#E2EBE8;--muted:#93A4A0;--line:#2B3835;--accent:#4CC0B0;--accent-ink:#04211D;--bad:#F08A80;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
#gate{min-height:80vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#gate form{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px 24px;display:grid;gap:14px;box-shadow:0 6px 24px rgba(20,40,36,.08)}
#gate .st{display:flex;flex-direction:column-reverse;width:34px;height:36px;border-radius:6px;overflow:hidden}
#gate .st i{flex:1}
#gate h1{font-size:21px;line-height:1.35;margin:0;font-family:"LXGW WenKai TC","Noto Serif TC",serif}
#gate p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
#gate label{font-weight:600;font-size:14px}
#gate input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
#gate input:focus{outline:2px solid var(--accent);outline-offset:1px}
#gate button{font:inherit;font-size:16px;font-weight:500;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
#gate button:disabled{opacity:.6}
#gate .err{color:var(--bad);font-size:14px;min-height:1.2em}
</style>
<div id="gate"><form id="gateForm" autocomplete="off">
<div class="st" aria-hidden="true"><i style="background:var(--l7)"></i><i style="background:var(--l6)"></i><i style="background:var(--l5)"></i><i style="background:var(--l4)"></i><i style="background:var(--l3)"></i><i style="background:var(--l2)"></i><i style="background:var(--l1)"></i></div>

<div style="display:grid;gap:6px"><label for="gatePw">密碼</label><input id="gatePw" type="password" required autofocus></div>
<button id="gateBtn" type="submit">開啟</button><div class="err" id="gateErr" role="alert"></div>
</form></div>

function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function open(pw){
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey("raw",enc.encode(pw.normalize("NFKC")),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c));
  return new TextDecoder().decode(pt);
}
function mount(html){
  var g=document.getElementById("gate"),s=document.getElementById("gateStyle");
  if(g)g.remove(); if(s)s.remove();
  document.body.appendChild(document.createRange().createContextualFragment(html));
}
async function tryPw(pw,silent){
  var btn=document.getElementById("gateBtn"),err=document.getElementById("gateErr");
  if(btn){btn.disabled=true;btn.textContent="開啟中…";}
  try{var html=await open(pw);try{sessionStorage.setItem("spds-gate",pw);}catch(e){} mount(html);return true;}
  catch(e){ if(!silent&&err)err.textContent="密碼不正確，請再試一次。"; if(btn){btn.disabled=false;btn.textContent="開啟";} return false;}
}
document.getElementById("gateForm").addEventListener("submit",function(e){e.preventDefault();tryPw(document.getElementById("gatePw").value,false);});
var saved=null;try{saved=sessionStorage.getItem("spds-gate");}catch(e){}
if(saved)tryPw(saved,true);
})();
</script>
